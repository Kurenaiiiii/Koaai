name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  binary:
    name: Release binary
    # 22.04 on purpose: keeps the binary's glibc requirement low enough for
    # Debian-bookworm-based Pterodactyl images (yolks). Don't bump casually.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build & registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: koaai-release

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: koaai-linux-x64
          path: target/release/koaai
          if-no-files-found: error

  test:
    name: Tests (debug — much faster than release)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build & registry
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test
