name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  binary:
    name: Release binary (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 on purpose: keeps the binary's glibc requirement low enough
          # for Debian-bookworm-based Pterodactyl images (yolks).
          - os: ubuntu-22.04
            artifact: koaai-linux-x64
            bin: koaai
            always: true
          - os: macos-14
            artifact: koaai-macos-arm64
            bin: koaai
            always: false
          - os: macos-13
            artifact: koaai-macos-intel
            bin: koaai
            always: false
          - os: windows-latest
            artifact: koaai-windows-x64
            bin: koaai.exe
            always: false
    # Linux ships on every push; the expensive runners (macOS bills 10x,
    # Windows 2x) build only when you manually hit "Run workflow".
    if: matrix.always || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build & registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: koaai-release
          key: ${{ matrix.artifact }}

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error

  test:
    name: Tests (debug — much faster than release)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build & registry
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test
