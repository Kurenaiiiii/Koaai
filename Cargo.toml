[package]
name = "koaai"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = { git = "https://github.com/serenity-rs/serenity", branch = "next", default-features = false, features = [
    "builder", "cache", "framework", "gateway", "http", "model", "utils", "rustls_backend",
] }
poise = { git = "https://github.com/serenity-rs/poise", branch = "serenity-next" }
songbird = { git = "https://github.com/serenity-rs/songbird", branch = "serenity-next", features = ["serenity", "driver", "builtin-queue"] }
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "ogg", "flac", "wav", "pcm"] }
rspotify = { version = "0.16", default-features = false, features = ["client-reqwest", "reqwest-rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
dotenvy = "0.15"
dashmap = "6"
regex = "1"
toml = "0.9"
chrono = "0.4"
urlencoding = "2"
small-fixed-array = "0.4.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
libc = "0.2" # for malloc_trim — keep RSS flat in long-running deploys

[profile.release]
lto = "thin"
strip = true
